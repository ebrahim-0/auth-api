stages:
#   - build
  - deploy

variables:
  PROJECT_NAME: "auth-api"
  DEPLOY_PATH: "C:/inetpub/wwwroot"
  REPO_URL: "git@gitlab.com:ibrahim.abdelrazik.3/auth-api.git"
  ENV_SOURCE: "C:/envs/auth-api/.env"
  GIT_USER_NAME: "gitlab-runner"
  GIT_USER_EMAIL: "runner@auth-api.com"
  APP_PORT: "5080"
  IIS_SITE_NAME: "auth-api"
  IIS_APP_POOL: "auth-api"
  IIS_HOST_NAME: ""
  SSH_EXE: "C:/Program Files/Git/usr/bin/ssh.exe"
  KEY_PATH: "C:/GitLab-Runner/.ssh/id_ed25519"
  NGROK_EXE: "C:/ngrok/ngrok.exe"
  BOT_PATH: "C:/telegram-app-manager"
  # GitLab CI/CD Variables needed:
  # TELEGRAM_TOKEN    - your bot token
  # TELEGRAM_CHAT_ID  - your chat id
  # NGROK_AUTHTOKEN   - your ngrok auth token

# ─────────────────────────────────────────────
# BUILD STAGE — compile TypeScript
# ─────────────────────────────────────────────
build:
  stage: build
  tags:
    - windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      Write-Host "============================================"
      Write-Host " BUILDING APPLICATION"
      Write-Host " $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
      Write-Host "============================================"

      Write-Host "--- Installing Dependencies ---"
      npm install
      if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
      Write-Host "OK: Dependencies installed."

      Write-Host "--- Building Application ---"
      $buildStart = Get-Date
      npm run build
      if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }
      $buildTime = [math]::Round(((Get-Date) - $buildStart).TotalSeconds, 1)
      Write-Host "OK: Build complete in ${buildTime}s."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never

# ─────────────────────────────────────────────
# DEPLOY STAGE — deploy to IIS
# ─────────────────────────────────────────────
deploy_production:
  stage: deploy
  only:
    - main
  tags:
    - windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      $scriptSuccess = $false
      $errorDetails  = $null

      # ──────────────────────────────────────────────────────────────────
      # HELPER: Send Telegram notification
      # ──────────────────────────────────────────────────────────────────
      function Send-TelegramMessage {
          param(
              [string]$Title,
              [string]$Message = "",
              [switch]$IsError
          )

          $token   = $env:TELEGRAM_TOKEN
          $chatId  = $env:TELEGRAM_CHAT_ID
          $jobId   = $env:CI_JOB_ID
          $branch  = $env:CI_COMMIT_BRANCH
          $commit  = $env:CI_COMMIT_SHORT_SHA
          $project = $env:PROJECT_NAME
          $jobUrl  = "$env:CI_PROJECT_URL/-/jobs/$jobId"

          $lines = @(
              $Title,
              "",
              "📦 App: $project",
              "🌿 Branch: $branch",
              "🔖 Commit: $commit",
              "🔧 Job ID: $jobId",
              "🌐 Open Job: $jobUrl"
          )

          if ($Message) {
              $lines += @("``````")
              $lines += $Message.Split("`n")
              $lines += @("``````")
          }

          $text     = $lines -join "`n"
          $textJson = $text.Replace('\', '\\').Replace('"', '\"')
          $telegramUrl = "https://api.telegram.org/bot" + $token + "/sendMessage"
          $json = "{""chat_id"":""$chatId"",""text"":""$textJson"",""reply_markup"":{""inline_keyboard"":[[{""text"":""📄 Open Job"",""url"":""$jobUrl""}]]}}"

          try {
              Invoke-RestMethod -Uri $telegramUrl -Method Post -Body $json -ContentType "application/json" -ErrorAction SilentlyContinue
              return $true
          } catch {
              Write-Host "Failed to send Telegram message: $_"
              return $false
          }
      }

      # ──────────────────────────────────────────────────────────────────
      # HELPER: Inject .env into IIS App Pool environmentVariables
      # ──────────────────────────────────────────────────────────────────
      function Set-IisAppPoolEnvVars {
          param(
              [string]$AppPoolName,
              [string]$EnvFilePath
          )

          Write-Host ""
          Write-Host "--- Injecting .env into IIS App Pool: $AppPoolName ---"

          if (!(Test-Path $EnvFilePath)) {
              throw ".env file not found at: $EnvFilePath"
          }

          # Load Microsoft.Web.Administration
          $mwaPath = "$env:windir\system32\inetsrv\Microsoft.Web.Administration.dll"
          if (!(Test-Path $mwaPath)) {
              throw "Microsoft.Web.Administration.dll not found. Ensure IIS Management Tools are installed."
          }
          Add-Type -Path $mwaPath

          # Parse .env — skip blank lines and comments
          $envLines = Get-Content $EnvFilePath | Where-Object {
              $_ -match '^\s*[^#\s]' -and $_ -match '='
          }

          $serverManager = New-Object Microsoft.Web.Administration.ServerManager
          $pool = $serverManager.ApplicationPools[$AppPoolName]

          # Create app pool if it doesn't exist yet
          if ($null -eq $pool) {
              Write-Host "  App pool '$AppPoolName' not found — creating it for env injection."
              $pool = $serverManager.ApplicationPools.Add($AppPoolName)
          }

          $envVarsCollection = $pool.GetChildElement("environmentVariables").GetCollection()

          $added   = 0
          $updated = 0

          foreach ($line in $envLines) {
              # Split only on the FIRST '=' so values containing '=' are preserved
              $eqIndex = $line.IndexOf('=')
              if ($eqIndex -lt 1) { continue }

              $key   = $line.Substring(0, $eqIndex).Trim()
              $value = $line.Substring($eqIndex + 1).Trim().Trim('"').Trim("'")

              if ([string]::IsNullOrWhiteSpace($key)) { continue }

              # Remove existing entry to prevent duplicates
              $existing = $envVarsCollection | Where-Object { $_["name"] -eq $key }
              if ($existing) {
                  $envVarsCollection.Remove($existing)
                  $updated++
                  Write-Host "  Updated: $key"
              } else {
                  $added++
                  Write-Host "  Added:   $key"
              }

              $entry          = $envVarsCollection.CreateElement("add")
              $entry["name"]  = $key
              $entry["value"] = $value
              $envVarsCollection.Add($entry) | Out-Null
          }

          $serverManager.CommitChanges()
          Write-Host "OK: Env vars injected — $added added, $updated updated."
      }

      # ──────────────────────────────────────────────────────────────────
      # HELPER: appcmd wrappers
      # ──────────────────────────────────────────────────────────────────
      $appcmd = Join-Path $env:windir "System32\inetsrv\appcmd.exe"

      function Invoke-AppCmd {
          param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
          $output = & $appcmd @Arguments 2>&1
          if ($LASTEXITCODE -ne 0) { throw "appcmd failed: $($Arguments -join ' ')`n$output" }
          return $output
      }

      function Test-IisSite     { param([string]$Name); $o = & $appcmd list site     $Name 2>$null; return ($LASTEXITCODE -eq 0 -and $o) }
      function Test-IisAppPool  { param([string]$Name); $o = & $appcmd list apppool  $Name 2>$null; return ($LASTEXITCODE -eq 0 -and $o) }
      function Get-IisSiteState    { param([string]$Name); return (& $appcmd list site    $Name /text:state 2>$null) }
      function Get-IisAppPoolState { param([string]$Name); return (& $appcmd list apppool $Name /text:state 2>$null) }

      # ══════════════════════════════════════════════════════════════════
      try {
          Write-Host "============================================"
          Write-Host " DEPLOYMENT STARTED"
          Write-Host " $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "============================================"

          # ── Notify: started ─────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Sending Deployment Started Notification ---"
          Send-TelegramMessage -Title "🚀 Deployment Started" -Message "Deployment is now running..."
          Write-Host "OK: Deployment started notification sent."

          # ── Validate variables ───────────────────────────────────────
          Write-Host ""
          Write-Host "--- Validating Variables ---"
          if (-not $env:REPO_URL)          { throw "REPO_URL variable is not set" }
          if (-not $env:APP_PORT)          { throw "APP_PORT variable is not set" }
          if ($env:APP_PORT -notmatch '^\d+$') { throw "APP_PORT must be a number" }
          if ($env:APP_PORT -eq "6000")    { throw "APP_PORT 6000 is blocked by Chrome/Edge (ERR_UNSAFE_PORT). Use 6080, 8080, or another safe port." }
          if (-not $env:IIS_SITE_NAME)     { $env:IIS_SITE_NAME = $env:PROJECT_NAME }
          if (-not $env:IIS_APP_POOL)      { $env:IIS_APP_POOL  = $env:IIS_SITE_NAME }
          if (-not $env:TELEGRAM_TOKEN)    { throw "TELEGRAM_TOKEN variable is not set" }
          if (-not $env:TELEGRAM_CHAT_ID)  { throw "TELEGRAM_CHAT_ID variable is not set" }
          if (-not $env:BOT_PATH)          { throw "BOT_PATH variable is not set" }

          $iisSiteName        = $env:IIS_SITE_NAME
          $iisAppPool         = $env:IIS_APP_POOL
          $appPort            = [int]$env:APP_PORT
          $iisHostName        = if ($env:IIS_HOST_NAME) { $env:IIS_HOST_NAME.Trim() } else { "" }
          $bindingInformation = "*:${appPort}:${iisHostName}"
          $projectPath        = Join-Path $env:DEPLOY_PATH $env:PROJECT_NAME
          $backupRoot         = Join-Path $env:DEPLOY_PATH "backups"

          Write-Host "  Project:     $env:PROJECT_NAME"
          Write-Host "  Repo URL:    $env:REPO_URL"
          Write-Host "  Deploy Path: $env:DEPLOY_PATH"
          Write-Host "  App Port:    $appPort"
          Write-Host "  IIS Site:    $iisSiteName"
          Write-Host "  IIS Pool:    $iisAppPool"
          Write-Host "  Bot Path:    $env:BOT_PATH"
          Write-Host "  Job ID:      $env:CI_JOB_ID"
          Write-Host "  Commit:      $env:CI_COMMIT_SHORT_SHA"
          Write-Host "  Branch:      $env:CI_COMMIT_BRANCH"
          Write-Host "OK: All variables present."

          # ── Validate appcmd ──────────────────────────────────────────
          if (!(Test-Path $appcmd)) {
              throw "appcmd.exe not found. Install IIS Management Scripts and Tools on this runner."
          }

          # ── Validate bot path ────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Validating Bot Path ---"
          $registerScript = Join-Path $env:BOT_PATH "register-app.js"
          if (!(Test-Path $env:BOT_PATH)) {
              Write-Host "  WARNING: BOT_PATH not found at: $env:BOT_PATH — registration will be skipped."
              $botAvailable = $false
          } elseif (!(Test-Path $registerScript)) {
              Write-Host "  WARNING: register-app.js not found at: $registerScript — registration will be skipped."
              $botAvailable = $false
          } else {
              Write-Host "  Bot path OK: $env:BOT_PATH"
              $botAvailable = $true
          }

          # ── SSH setup ────────────────────────────────────────────────
          Write-Host ""
          Write-Host "--- SSH Setup ---"
          $ssh     = $env:SSH_EXE
          $keyPath = $env:KEY_PATH
          if (!(Test-Path $ssh))     { throw "ssh.exe not found at: $ssh" }
          if (!(Test-Path $keyPath)) { throw "SSH key not found at: $keyPath" }
          Write-Host "  ssh.exe: $ssh"
          Write-Host "  Key:     $keyPath"

          $sshDir     = "C:\GitLab-Runner\.ssh"
          $knownHosts = "$sshDir\known_hosts"
          if (!(Test-Path $sshDir)) { New-Item -ItemType Directory -Path $sshDir | Out-Null }
          $existing = if (Test-Path $knownHosts) { Get-Content $knownHosts -Raw } else { "" }
          if ($existing -notlike "*gitlab.com*") {
              Add-Content -Path $knownHosts -Value "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf"
              Add-Content -Path $knownHosts -Value "gitlab.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBFSMqzJeV9rUzU4kWitGgoYeeZkL+xaueTAOaClDKQ0a7NaT4x6L+BhU4qe3cJCvEUoIFBp8W1Gz2C3bTxGPCmU="
              Write-Host "  Added gitlab.com to known_hosts."
          } else {
              Write-Host "  gitlab.com already in known_hosts."
          }

          # ── Git identity ─────────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Git Identity ---"
          git config --global user.name  $env:GIT_USER_NAME
          git config --global user.email $env:GIT_USER_EMAIL
          $env:GIT_SSH_COMMAND = """$ssh"" -i ""$keyPath"" -o StrictHostKeyChecking=no"
          Write-Host "  Git version: $(git --version)"
          Write-Host "  User name:   $(git config --global user.name)"
          Write-Host "  User email:  $(git config --global user.email)"
          Write-Host "  SSH command: $env:GIT_SSH_COMMAND"

          Write-Host ""
          Write-Host "--- Testing GitLab SSH Connection ---"
          $sshTest = & "$ssh" -i "$keyPath" -o StrictHostKeyChecking=no -T git@gitlab.com 2>&1
          Write-Host "  Result: $sshTest"
          if ($sshTest -match "Permission denied") { throw "GitLab SSH auth failed" }
          Write-Host "OK: SSH connection successful."

          # ── Stop IIS before pulling ──────────────────────────────────
          Write-Host ""
          Write-Host "--- Preparing IIS ---"
          if (Test-IisSite $iisSiteName) {
              Write-Host "  Stopping IIS website: $iisSiteName"
              & $appcmd stop site /site.name:$iisSiteName 2>$null | Out-Null
          } else {
              Write-Host "  IIS website does not exist yet; will be created after build."
          }
          if (Test-IisAppPool $iisAppPool) {
              Write-Host "  Stopping IIS app pool: $iisAppPool"
              & $appcmd stop apppool /apppool.name:$iisAppPool 2>$null | Out-Null
              Start-Sleep -Seconds 3
          } else {
              Write-Host "  IIS app pool does not exist yet; will be created after build."
          }

          # ── Inject .env → IIS App Pool env vars ─────────────────────
          # Runs BEFORE clone/build so variables are committed to
          # applicationHost.config and ready when iisnode first starts.
          Set-IisAppPoolEnvVars -AppPoolName $iisAppPool -EnvFilePath $env:ENV_SOURCE

          # ── Clone or pull ────────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Clone or Pull Repository ---"
          Write-Host "  URL:         $env:REPO_URL"
          Write-Host "  Destination: $projectPath"

          if (Test-Path $projectPath) {
              Write-Host "  Directory exists — syncing to origin/main..."
              Set-Location $projectPath
              git remote set-url origin "$env:REPO_URL"
              if ($LASTEXITCODE -ne 0) { throw "git remote set-url failed" }
              git fetch origin main
              if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
              git reset --hard origin/main
              if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
              Write-Host "OK: Synced. Latest commit: $(git log -1 --format='%H %s')"
          } else {
              Write-Host "  Directory does not exist — cloning..."
              Set-Location $env:DEPLOY_PATH
              git clone "$env:REPO_URL" "$env:PROJECT_NAME"
              if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
              Write-Host "OK: Cloned. Latest commit: $(git -C "$projectPath" log -1 --format='%H %s')"
          }

          # ── Copy .env file ───────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Copying .env ---"
          Write-Host "  From: $env:ENV_SOURCE"
          Write-Host "  To:   $projectPath\.env"
          Copy-Item "$env:ENV_SOURCE" "$projectPath\.env" -Force
          Write-Host "OK: .env copied."

          # ── Install & build ──────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Deploying Application ---"
          Set-Location $projectPath

          Write-Host "--- Installing Dependencies ---"
          Write-Host "  node: $(node --version)"
          Write-Host "  npm:  $(npm --version)"
          npm install
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          Write-Host "OK: Dependencies installed."

          Write-Host "--- Building Application (TypeScript) ---"
          $buildStart = Get-Date
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }
          $buildTime = [math]::Round(((Get-Date) - $buildStart).TotalSeconds, 1)
          Write-Host "OK: Build complete in ${buildTime}s."

          # ── Configure & start IIS ────────────────────────────────────
          Write-Host ""
          Write-Host "--- Starting Application with IIS ---"

          # Ensure logs directory exists
          if (!(Test-Path "logs")) {
              New-Item -ItemType Directory -Path "logs" -Force | Out-Null
              Write-Host "  Created logs directory."
          }

          # Remove legacy PM2 process if present
          if (Get-Command pm2 -ErrorAction SilentlyContinue) {
              Write-Host "  Cleaning up legacy PM2 process for $env:PROJECT_NAME..."
              & pm2 delete "$env:PROJECT_NAME" 2>$null
          }

          # Create app pool if missing
          if (!(Test-IisAppPool $iisAppPool)) {
              Write-Host "  Creating IIS app pool: $iisAppPool"
              Invoke-AppCmd add apppool /name:$iisAppPool | Out-Null
          } else {
              Write-Host "  IIS app pool exists: $iisAppPool"
          }

          # Configure app pool (no managed runtime = node)
          Invoke-AppCmd set apppool /apppool.name:$iisAppPool `
              /managedRuntimeVersion: `
              /processModel.identityType:ApplicationPoolIdentity `
              /autoStart:true | Out-Null

          # Recreate site with correct binding
          if (Test-IisSite $iisSiteName) {
              Write-Host "  Recreating IIS website with binding: http/$bindingInformation"
              & $appcmd stop site /site.name:$iisSiteName 2>$null | Out-Null
              Invoke-AppCmd delete site $iisSiteName | Out-Null
          } else {
              Write-Host "  Creating IIS website: $iisSiteName on port $appPort"
          }

          Invoke-AppCmd add site /name:$iisSiteName /bindings:"http/$bindingInformation" /physicalPath:$projectPath | Out-Null
          Invoke-AppCmd set app  "$iisSiteName/"  /applicationPool:$iisAppPool | Out-Null
          Invoke-AppCmd set vdir "$iisSiteName/"  /physicalPath:$projectPath   | Out-Null

          Start-Sleep -Seconds 3

          if ((Get-IisAppPoolState $iisAppPool) -ne "Started") {
              Write-Host "  Starting IIS app pool: $iisAppPool"
              Invoke-AppCmd start apppool /apppool.name:$iisAppPool | Out-Null
          } else {
              Write-Host "  IIS app pool already started."
          }

          if ((Get-IisSiteState $iisSiteName) -ne "Started") {
              Write-Host "  Starting IIS website: $iisSiteName"
              Invoke-AppCmd start site /site.name:$iisSiteName | Out-Null
          } else {
              Write-Host "  IIS website already started."
          }

          Write-Host "  Waiting for IIS/iisnode startup..."
          Start-Sleep -Seconds 8

          # ── Health check ─────────────────────────────────────────────
          $healthUrl       = "http://127.0.0.1:$appPort/"
          $serverHealthUrl = "http://192.168.1.27:$appPort/"
          Write-Host ""
          Write-Host "  Health check:        $healthUrl"
          Write-Host "  Server health check: $serverHealthUrl"
          try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri $healthUrl -Method Head -TimeoutSec 30
              Write-Host "  Status: $($response.StatusCode) $($response.StatusDescription)"
              if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
                  throw "Unexpected IIS health status: $($response.StatusCode)"
              }
          } catch {
              if (Test-Path "logs") {
                  Write-Host "  Recent logs:"
                  Get-ChildItem "logs" -Filter "*.log" -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 3 |
                    ForEach-Object {
                        Write-Host "  Log: $($_.FullName)"
                        Get-Content $_.FullName -Tail 20 -ErrorAction SilentlyContinue |
                          ForEach-Object { Write-Host "    $_" }
                    }
              }
              throw "IIS health check failed: $($_.Exception.Message)"
          }
          Write-Host "OK: Application running on port $appPort."

          # ── Register app in bot DB ───────────────────────────────────
          Write-Host ""
          Write-Host "--- Registering App in Bot Database ---"
          if ($botAvailable) {
              node "$registerScript" `
                --name "$env:PROJECT_NAME" `
                --port "$env:APP_PORT" `
                --path "$projectPath"
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "  WARNING: App registration failed (non-fatal)."
              } else {
                  Write-Host "OK: App registered in bot database."
              }
          } else {
              Write-Host "  Skipping — bot not available at $env:BOT_PATH"
          }

          # ── Start ngrok ──────────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Starting ngrok ---"

          if (-not $env:NGROK_AUTHTOKEN) { throw "NGROK_AUTHTOKEN variable is not set" }

          $ngrok = if (Test-Path $env:NGROK_EXE) { $env:NGROK_EXE } else { "ngrok" }
          if (!(Test-Path $ngrok)) { throw "ngrok.exe not found at $ngrok" }
          Write-Host "  ngrok path: $ngrok"

          Write-Host "  Configuring ngrok auth token..."
          & "$ngrok" config add-authtoken $env:NGROK_AUTHTOKEN
          if ($LASTEXITCODE -ne 0) { throw "Failed to configure ngrok authtoken" }
          Write-Host "OK: ngrok auth token configured."

          $domain       = "unavailable"
          $ngrokSuccess = $false

          try {
              $ngrokProcess = Start-Process `
                  -FilePath    $ngrok `
                  -ArgumentList "http", "$env:APP_PORT" `
                  -PassThru `
                  -WindowStyle Hidden `
                  -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 8

              if ($ngrokProcess.HasExited) {
                  Write-Host "  WARNING: ngrok exited immediately (non-fatal)."
              } else {
                  Write-Host "  ngrok PID: $($ngrokProcess.Id)"
                  $ngrokSuccess = $true

                  Write-Host "  Fetching tunnel URL..."
                  for ($i = 1; $i -le 10; $i++) {
                      try {
                          $tunnels = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                          $tunnel  = $tunnels.tunnels |
                              Where-Object { $_.public_url -like "https://*" } |
                              Select-Object -First 1
                          if ($tunnel) { $domain = $tunnel.public_url; break }
                          Write-Host "  Not ready yet... retry $i/10"
                      } catch {
                          Write-Host "  Waiting for ngrok API... retry $i/10"
                      }
                      Start-Sleep -Seconds 3
                  }
              }
          } catch {
              Write-Host "  WARNING: ngrok startup failed (non-fatal): $_"
          }

          Write-Host "OK: Domain: $domain"

          # ── Update bot DB with ngrok domain ─────────────────────────
          Write-Host ""
          Write-Host "--- Updating Bot Database with Domain ---"
          if ($domain -ne "unavailable" -and $botAvailable) {
              node "$registerScript" `
                --name  "$env:PROJECT_NAME" `
                --port  "$env:APP_PORT" `
                --path  "$projectPath" `
                --ngrok "$domain"
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "OK: Domain saved to bot database."
              } else {
                  Write-Host "  WARNING: Could not update domain in bot DB."
              }
          } else {
              Write-Host "  Skipping (domain=$domain, botAvailable=$botAvailable)."
          }

          # ── Notify: success ──────────────────────────────────────────
          Write-Host ""
          Write-Host "--- Sending Success Notification ---"
          if ($domain -ne "unavailable") {
              Send-TelegramMessage -Title "✅ Deployment Successful!" -Message "App is running on port $env:APP_PORT.`nDomain: $domain"
          } else {
              Send-TelegramMessage -Title "⚠️ Deployment Complete (No Domain)" -Message "App is running on port $env:APP_PORT, but ngrok domain was unavailable."
          }
          Write-Host "OK: Success notification sent."

          $scriptSuccess = $true

          Write-Host ""
          Write-Host "============================================"
          Write-Host " DEPLOYMENT FINISHED SUCCESSFULLY"
          Write-Host " $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "============================================"
      }
      catch {
          $errorDetails = $_.Exception.Message
          Write-Host ""
          Write-Host "============================================"
          Write-Host " DEPLOYMENT FAILED"
          Write-Host " $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "============================================"
          Write-Host "Error: $errorDetails"

          Write-Host ""
          Write-Host "--- Sending Failure Notification ---"
          $errorSnippet = if ($errorDetails.Length -gt 1000) { $errorDetails.Substring(0, 1000) + "..." } else { $errorDetails }
          Send-TelegramMessage -Title "❌ Deployment Failed" -Message $errorSnippet -IsError
          Write-Host "OK: Failure notification sent."

          throw $_
